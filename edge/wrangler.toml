name = "lift-edge"
main = "worker.js"
compatibility_date = "2025-11-27"
workers_dev = false

# Reverse-proxy in front of any origin. Defaults target the local demo site
# (`npm run site`) and a self-hosted Flagsmith (`http://127.0.0.1:8000`).
# The client environment key is a secret binding: copy .dev.vars.example to
# .dev.vars and never commit it.

[dev]
ip = "127.0.0.1"
port = 8787
local_protocol = "http"

[vars]
ORIGIN = "http://127.0.0.1:4174"
FLAGSMITH_API_URL = "http://127.0.0.1:8000/api/v1/"
FLAGSMITH_FLAG_NAME = "lift_edge_spec"
FLAGSMITH_SDK_URL = "https://cdn.jsdelivr.net/npm/@flagsmith/flagsmith@12.4.0/+esm"
FLAGSMITH_EVAL_TIMEOUT_MS = "300"

[[kv_namespaces]]
binding = "SPECS"
id = "00000000000000000000000000000001"

# runtime/*.js served from the repo's runtime/ via a symlink. run_worker_first
# keeps fail-open and Cache-Control in the Worker; the Worker then fetches
# these files from ASSETS for /runtime/* only.
[assets]
directory = "./runtime-assets"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"
