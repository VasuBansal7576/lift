# Overlay used only by the T3 cold-start recording.
# Distinct compose project + host port. Does not touch lift-selfhost on :8000.
services:
  postgres:
    container_name: flagsmith_postgres_proof
  flagsmith:
    container_name: flagsmith_proof
    ports: !override
      - 127.0.0.1:${FLAGSMITH_HTTP_PORT:-8010}:8000
    environment:
      FLAGSMITH_DOMAIN: localhost:${FLAGSMITH_HTTP_PORT:-8010}
