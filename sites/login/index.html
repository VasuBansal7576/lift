<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas Board — Sign in</title>
  <link rel="stylesheet" href="../shared/styles.css">
</head>
<body data-site="login">
  <p class="sim-banner" role="note">Demo product. Experiment traffic is simulated.</p>
  <header class="masthead">
    <a class="wordmark" href="./">Atlas Board</a>
  </header>
  <main>
    <p class="eyebrow">Members</p>
    <h1>Sign in</h1>
    <p class="lede">Continue to your boards.</p>
    <form id="lift-form" data-lift-flow="login" novalidate>
      <div class="field-grid" data-barrier="missing_labels">
        <p>
          <span class="visible-hint">Email</span>
          <input id="email" name="email" type="email" placeholder="you@atlas.test" autocomplete="off" data-barrier="autocomplete_off" data-unlabeled data-lift-field data-lift-label="Email" data-lift-autocomplete="username">
        </p>
        <p>
          <span class="visible-hint">Password</span>
          <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="off" data-unlabeled data-lift-field data-lift-label="Password" data-lift-autocomplete="current-password">
        </p>
      </div>
      <p class="terms contrast-fail" data-barrier="low_contrast">
        <span id="terms-copy" data-lift-contrast>Forgot password? We email a reset link that expires in an hour.</span>
      </p>
      <button type="button" id="signin" class="icon-btn" data-barrier="unlabeled_icon" data-lift-submit data-lift-name="Sign in" data-lift-glyph="🔒"></button>
      <p id="form-error" role="alert" hidden></p>
    </form>
    <p id="confirmation" data-lift-confirm hidden>Signed in. Opening your last board.</p>
  </main>
  <footer>
    <p>Atlas Board — accessibility experiment fixture.</p>
    <p id="flag-status">Waiting for Flagsmith…</p>
  </footer>
  <script type="module" src="../shared/lift-sdk.js"></script>
</body>
</html>
